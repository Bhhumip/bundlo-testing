services:
  postgres:
    image: postgres:16-alpine
    container_name: bundlo-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: bundlo
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: bundlo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: